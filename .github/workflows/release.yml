name: Build de Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
            asset: maodevaca-windows-amd64.exe
            installer: maodevaca-windows-amd64-setup.exe
            nsis: true
          - name: linux-amd64
            os: ubuntu-latest
            platform: linux/amd64
            asset: maodevaca-linux-amd64
          - name: darwin-universal
            os: macos-latest
            platform: darwin/universal
            asset: maodevaca-darwin-universal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala a CLI do Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1

      - name: Dependências do Linux (GTK/WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build (${{ matrix.platform }})${{ matrix.nsis && ' + instalador NSIS' || '' }}
        run: wails build -platform ${{ matrix.platform }} -clean -ldflags "-s -w" ${{ matrix.nsis && '-nsis' || '' }}

      - name: Prepara os binários para publicação
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.nsis }}" = "true" ]; then
            cp build/bin/maodevaca.exe dist/${{ matrix.asset }}
            cp build/bin/*-installer.exe dist/${{ matrix.installer }}
          else
            cp build/bin/* dist/${{ matrix.asset }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

      - name: Anexa binários ao release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

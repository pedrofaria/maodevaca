name: Build de Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # O sum.golang.org é instável com HTTP/2 ("stream error ... INTERNAL_ERROR").
    # Forçar HTTP/1.1 no cliente HTTP do Go elimina a maioria dessas falhas.
    env:
      GODEBUG: http2client=0
      # Evita OOM no build do frontend (Vite/Vue) nos runners — recomendação
      # oficial da doc de cross-platform build do Wails.
      NODE_OPTIONS: "--max-old-space-size=4096"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64
            asset: maodevaca-windows-amd64.exe
            installer: maodevaca-windows-amd64-setup.exe
            nsis: true
          - name: linux-amd64
            os: ubuntu-latest
            platform: linux/amd64
            asset: maodevaca-linux-amd64
          - name: darwin-universal
            os: macos-latest
            platform: darwin/universal
            asset: maodevaca-darwin-universal.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # O Wails v2.10 NÃO publica binário da CLI na release, então o `go install`
      # é o único caminho. Ele baixa deps e verifica no sum.golang.org (instável
      # em HTTP/2 — contornado pelo GODEBUG do job). Loop de retry por segurança.
      - name: Instala a CLI do Wails
        shell: bash
        run: |
          for i in 1 2 3 4; do
            if go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1; then
              echo "CLI do Wails instalada com sucesso."
              exit 0
            fi
            echo "Tentativa $i falhou; aguardando 5s..."
            sleep 5
          done
          echo "Todas as tentativas falharam."
          exit 1

      # Pré-baixa as dependências Go do app com retry: em cache frio o `wails build`
      # sofre o mesmo problema de verificação no sum.golang.org.
      - name: Baixa dependências Go (com retry)
        shell: bash
        run: |
          for i in 1 2 3; do
            if go mod download; then
              echo "Dependências Go baixadas com sucesso."
              exit 0
            fi
            echo "Tentativa $i falhou; aguardando 5s..."
            sleep 5
          done
          echo "Falha ao baixar dependências Go."
          exit 1

      # O Wails v2.10 NÃO baixa o NSIS sozinho: sem "makensis" no PATH ele apenas
      # loga um warning e pula o instalador (build "passa" sem gerar nada).
      - name: Instala o NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # Garante o PATH caso o pacote não o registre sozinho
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          makensis /VERSION

      - name: Dependências do Linux (GTK/WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # O ubuntu-latest é o Ubuntu 24.04, que só tem webkit2gtk 4.1 (não existe
          # libwebkit2gtk-4.0-dev). O Wails v2 usa 4.1 quando buildado com a tag
          # webkit2_41 (ver passo Build) — sem ela, procura webkit2gtk-4.0 e falha.
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build (${{ matrix.platform }})${{ matrix.nsis && ' + instalador NSIS' || '' }}
        # No Linux o Wails v2 exige -tags webkit2_41 para linkar contra webkit2gtk-4.1
        # (distribuições modernas como Ubuntu 24.04 não têm mais o pacote 4.0).
        run: wails build -platform ${{ matrix.platform }} -clean -ldflags "-s -w" ${{ matrix.nsis && '-nsis' || '' }} ${{ runner.os == 'Linux' && '-tags webkit2_41' || '' }}

      - name: Prepara os binários para publicação
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.nsis }}" = "true" ]; then
            cp build/bin/maodevaca.exe dist/${{ matrix.asset }}
            cp build/bin/*-installer.exe dist/${{ matrix.installer }}
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # No macOS o wails gera um bundle .app (diretório) — empacota em .zip.
            ditto -c -k --sequesterRsrc --keepParent "build/bin/Mão de Vaca.app" "dist/${{ matrix.asset }}"
          else
            cp build/bin/maodevaca dist/${{ matrix.asset }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

      - name: Anexa binários ao release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
